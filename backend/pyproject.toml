[project]
name = "devpulse-backend"
version = "0.1.0"
description = "DevPulse — Engineering Incident & Service Management Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141,<0.142",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "email-validator>=2.2",
    "pyjwt>=2.9,<3.0",
    "bcrypt>=4.2,<5.0",
    "redis>=5.2,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends()/Query() in argument defaults is FastAPI's documented pattern
    "E501",  # line length is handled by review, not lint (long OpenAPI strings, SQL, test URLs)
    "UP042", # `class X(str, Enum)` kept deliberately: values are stored in native Postgres enums
    "UP046", # generic-class syntax churn, no benefit here
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs queries inside greenlets; without this coverage.py
# silently under-reports every line that executes after an `await db.execute(...)`.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_empty = true
