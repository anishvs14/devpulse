# Needed for WebSockets through a proxy: upgrade only when the client asked to.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The WebSocket handshake puts the JWT in the query string (?token=...), so the access log
# records $uri (path only) instead of $request (path + query). Tokens must not land in logs.
log_format noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout noquery;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and WebSocket -> backend container. The URI is passed through unchanged, so the
    # backend still sees /api/v1/... exactly as it does in local development.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;   # long-lived WebSocket connections
    }

    # Hashed build assets never change, so browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/incidents/123) must load index.html, not 404.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
